<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>曜程 · 客户模块中心</title>
  <link rel="icon" href="data:,">
  <style>
    :root{--navy:#031427;--navy-2:#061a30;--navy-3:#0a223b;--navy-4:#0d2b48;--teal:#13b8b2;--teal-strong:#07978f;--text:#f4fbff;--muted:#93aabd;--line:rgba(119,168,200,.28);--panel:#091f36;--danger:#ff827c}
    *{box-sizing:border-box}
    html{background:var(--navy)}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at 78% 4%,rgba(19,184,178,.12),transparent 28rem),linear-gradient(155deg,#021225 0%,#061a30 62%,#031427 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
    button,input{font:inherit}
    .shell{width:min(1440px,100%);margin:0 auto;padding:38px 38px 26px}
    .top{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-bottom:28px}
    .brand{display:flex;align-items:center;gap:18px;min-width:0}.brand-mark{width:52px;height:52px;display:grid;place-items:center;border:1px solid rgba(107,238,228,.42);border-radius:12px;background:linear-gradient(145deg,#0faaa6,#08778a);box-shadow:0 12px 32px rgba(7,151,143,.25);font-size:15px;font-weight:900;letter-spacing:.08em}.brand-copy{min-width:0}.brand-title{display:flex;align-items:center;gap:18px}.brand-title h1{margin:0;font-size:28px;line-height:1.2;letter-spacing:.02em}.brand-title span{padding-left:18px;border-left:1px solid rgba(147,170,189,.4);color:#a7bdcd;font-size:15px;font-weight:650;white-space:nowrap}.muted{color:var(--muted);font-size:13px}.brand-copy>.muted{margin-top:7px}
    .actions{display:flex;gap:10px;flex:0 0 auto}.btn{min-height:42px;display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(129,176,207,.42);background:#081d33;color:#dceaf4;border-radius:8px;padding:9px 16px;text-decoration:none;cursor:pointer;font-weight:750;transition:border-color .18s ease,background .18s ease,color .18s ease,transform .18s ease}.btn:hover{border-color:rgba(78,225,214,.72);color:#fff;transform:translateY(-1px)}.btn:focus-visible{outline:3px solid rgba(58,227,215,.3);outline-offset:2px}.btn.primary{border-color:var(--teal);background:var(--teal-strong);color:#fff;box-shadow:0 9px 24px rgba(7,151,143,.18)}
    .overview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:32px;border:1px solid var(--line);border-radius:12px;background:rgba(7,28,50,.72);box-shadow:0 18px 52px rgba(0,9,22,.24);overflow:hidden}.overview-card{display:grid;grid-template-columns:40px minmax(0,1fr);align-items:center;gap:14px;min-height:112px;padding:21px 28px;border-right:1px solid var(--line)}.overview-card:last-child{border-right:0}.metric-code{width:40px;height:40px;display:grid!important;place-items:center;border:1px solid rgba(54,207,196,.24);border-radius:9px;background:rgba(16,69,91,.58);color:#55d8d0!important;font-size:10px!important;font-weight:900;letter-spacing:.04em}.metric-copy{min-width:0}.overview-card .metric-label{display:block;color:#a6bac9;font-size:12px;font-weight:700}.overview-card b{display:block;margin-top:5px;color:#fff;font-size:24px;font-variant-numeric:tabular-nums}
    .section-title{display:flex;align-items:end;justify-content:space-between;gap:18px;margin:0 0 18px;padding-left:14px;border-left:4px solid var(--teal)}.section-title h2{font-size:21px;margin:0;letter-spacing:.02em}.section-title .muted{text-align:right}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.card{min-width:0;display:flex;flex-direction:column;padding:26px 26px 24px;border:1px solid rgba(119,168,200,.34);border-radius:12px;background:linear-gradient(145deg,rgba(10,34,59,.98),rgba(6,25,45,.98));box-shadow:0 18px 48px rgba(0,9,22,.25);transition:border-color .18s ease,transform .18s ease,box-shadow .18s ease}.card:hover{border-color:rgba(54,207,196,.5);transform:translateY(-2px);box-shadow:0 22px 56px rgba(0,9,22,.34)}.card-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.icon{min-width:54px;height:36px;display:grid;place-items:center;border:1px solid rgba(54,207,196,.28);border-radius:8px;background:#0b3d55;color:#45d5cd;font-weight:900;font-size:13px;letter-spacing:.06em}.availability{color:#80d8d3;font-size:11px;font-weight:750}.card h2{margin:18px 0 7px;color:#fff;font-size:25px;letter-spacing:.01em}.card p{min-height:44px;margin:0 0 17px;color:#a8bdcc;line-height:1.7;font-size:13px}.module-visual{height:210px;margin:0 0 17px;border:1px solid rgba(119,168,200,.32);border-radius:9px;background-color:#061a30;background-position:center;background-repeat:no-repeat;background-size:cover;box-shadow:inset 0 0 32px rgba(0,10,22,.3)}.module-day1 .module-visual{background-image:url('/assets/yaocheng-module-day1-dark.png')}.module-multiday .module-visual{background-image:url('/assets/yaocheng-module-multiday-dark.png')}.module-dispatch .module-visual{background-image:url('/assets/yaocheng-module-dispatch-dark.png')}.meta{min-height:18px;margin:0 0 17px;color:#9bb0c0;font-size:12px;line-height:1.5}.card .btn{width:100%;justify-content:space-between;border-color:#1bc7c0;background:linear-gradient(90deg,#09958f,#0db4ae);font-size:14px}.card .btn span:last-child{font-size:21px;font-weight:500;line-height:1}.empty{grid-column:1/-1;border:1px dashed rgba(119,168,200,.44);border-radius:12px;padding:42px;text-align:center;background:rgba(7,28,50,.65);color:var(--muted)}
    .footer{margin-top:26px;padding-top:18px;border-top:1px solid rgba(119,168,200,.16);color:#6f879b;font-size:11px;text-align:right}
    .login{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 22%,rgba(19,184,178,.14),transparent 24rem),var(--navy)}.login-card{width:min(450px,100%);border:1px solid rgba(119,168,200,.34);border-radius:14px;padding:30px;background:#081f36;box-shadow:0 28px 84px rgba(0,8,20,.48)}.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:8px}.login-card h1{margin:0;font-size:26px}.login-card>.muted{line-height:1.7}.field{margin-top:15px}.field label{display:block;margin-bottom:7px;color:#dceaf4;font-size:12px;font-weight:800}.field input{width:100%;min-height:46px;padding:10px 12px;border:1px solid #31516a;border-radius:8px;background:#0c2a46;color:#f4fbff;outline:none}.field input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(19,184,178,.17)}.error{display:none;margin-top:12px;padding:10px;border-radius:8px;color:#ffd4d1;background:rgba(131,33,34,.28);border:1px solid rgba(255,130,124,.42);font-size:12px}
    @media(max-width:1120px){.shell{padding-inline:24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card:last-child:nth-child(odd){grid-column:1/-1}.overview-card{padding-inline:18px}.module-visual{height:220px}}
    @media(max-width:800px){.shell{padding:24px 12px}.top{align-items:flex-start;flex-direction:column;margin-bottom:20px}.brand-title{align-items:flex-start;flex-direction:column;gap:5px}.brand-title span{padding-left:0;border-left:0;white-space:normal}.brand-copy>.muted{line-height:1.6}.actions{width:100%;display:grid;grid-template-columns:1.5fr .75fr .75fr}.actions .btn{text-align:center;white-space:nowrap;padding-left:7px;padding-right:7px}.overview{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:24px}.overview-card{min-height:92px;padding:15px;border-bottom:1px solid var(--line)}.overview-card:nth-child(2n){border-right:0}.overview-card:nth-child(n+3){border-bottom:0}.section-title{align-items:flex-start;flex-direction:column;gap:6px}.section-title .muted{text-align:left}.grid{grid-template-columns:1fr}.card:last-child:nth-child(odd){grid-column:auto}.card{padding:20px}.module-visual{height:200px}.brand-mark{width:44px;height:44px}.footer{text-align:left}}
    @media(max-width:480px){.overview-card{grid-template-columns:1fr;gap:8px}.metric-code{width:34px;height:30px}.overview-card b{font-size:21px}.card h2{font-size:22px}.module-visual{height:168px}}
  </style>
</head>
<body>
  <div class="login" id="loginView"><div class="login-card"><div class="login-brand"><span class="brand-mark" aria-hidden="true">YC</span><h1>曜程</h1></div><div class="muted">登录客户单位账号，进入已开通的数字化业务模块。</div><div class="error" id="loginError"></div><div class="field"><label for="loginUser">账号</label><input id="loginUser" autocomplete="username"></div><div class="field"><label for="loginPass">密码</label><input id="loginPass" type="password" autocomplete="current-password"></div><button class="btn primary" style="width:100%;margin-top:16px" onclick="login()">登录</button></div></div>
  <main class="shell">
    <header class="top"><div class="brand"><span class="brand-mark" aria-hidden="true">YC</span><div class="brand-copy"><div class="brand-title"><h1>曜程模块中心</h1><span>数字化指挥中心</span></div><div class="muted" id="identity">正在读取客户账号</div></div></div><div class="actions"><a class="btn primary" href="/workspace.html">业务资料中心</a><a class="btn" href="/sales.html">首页</a><button class="btn" onclick="logout()">退出</button></div></header>
    <section class="overview" aria-label="本单位业务概览"><div class="overview-card"><span class="metric-code" aria-hidden="true">CRM</span><div class="metric-copy"><span class="metric-label">客户档案</span><b id="overviewCustomers">--</b></div></div><div class="overview-card"><span class="metric-code" aria-hidden="true">SUP</span><div class="metric-copy"><span class="metric-label">共享供方</span><b id="overviewSuppliers">--</b></div></div><div class="overview-card"><span class="metric-code" aria-hidden="true">PLAN</span><div class="metric-copy"><span class="metric-label">有效方案</span><b id="overviewSchemes">--</b></div></div><div class="overview-card"><span class="metric-code" aria-hidden="true">MOD</span><div class="metric-copy"><span class="metric-label">已开通模块</span><b id="overviewModules">--</b></div></div></section>
    <div class="section-title"><h2>业务模块</h2><span class="muted">资料库跨模块共享，方案数据按模块独立管理</span></div>
    <section class="grid" id="moduleGrid"></section>
    <footer class="footer">新未来（天津）教育科技有限公司 · 曜程线上 SaaS</footer>
  </main>
  <script>
    'use strict';
    localStorage.removeItem('yx_saas_customer_token');
    const modulePresentation={day1:{code:'D1',className:'module-day1'},multiday:{code:'MD',className:'module-multiday'},dispatch:{code:'BUS',className:'module-dispatch'}};
    const roleNames={tenant_admin:'客户超级管理员',day1_admin:'单日模块管理员',user:'业务操作员',manager:'模块管理员',editor:'业务操作员',viewer:'查看人员'};
    function esc(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
    function csrfToken(){const cookie=String(document.cookie||''),match=cookie.match(/(?:^|;\s*)yaocheng_customer_csrf=([^;]+)/)||cookie.match(/(?:^|;\s*)yaocheng_csrf=([^;]+)/);return match?decodeURIComponent(match[1]):'';}
    async function api(path,options={}){const method=(options.method||'GET').toUpperCase(),headers={'Content-Type':'application/json','X-Yaocheng-Session-Scope':'customer'},csrf=csrfToken();if(['POST','PATCH','DELETE'].includes(method)&&csrf)headers['X-CSRF-Token']=csrf;const response=await fetch(path,{method,headers,credentials:'same-origin',body:options.body===undefined?undefined:JSON.stringify(options.body)});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'请求失败');return data;}
    function showError(message){const box=document.getElementById('loginError');box.textContent=message||'';box.style.display=message?'block':'none';}
    async function login(){try{await api('/api/login',{method:'POST',body:{username:document.getElementById('loginUser').value.trim(),password:document.getElementById('loginPass').value}});await boot();}catch(error){showError(error.message);}}
    async function logout(){try{await api('/api/logout',{method:'POST',body:{}});}catch(error){}location.reload();}
    async function boot(){if(!csrfToken())return;try{const [me,modules,overview]=await Promise.all([api('/api/me'),api('/api/modules'),api('/api/workspace/overview')]);document.getElementById('identity').textContent=me.user.username+' · '+(roleNames[me.user.role]||me.user.role)+' · 数据范围：本单位';const items=modules.items||[];document.getElementById('overviewCustomers').textContent=overview.customer_count+' 个';document.getElementById('overviewSuppliers').textContent=overview.supplier_count+' 个';document.getElementById('overviewSchemes').textContent=overview.scheme_count+' 个';document.getElementById('overviewModules').textContent=items.length+' 个';document.getElementById('moduleGrid').innerHTML=items.length?items.map(item=>{const presentation=modulePresentation[item.key]||{code:'MOD',className:''};return '<article class="card '+presentation.className+'"><div class="card-top"><div class="icon">'+presentation.code+'</div><span class="availability">已开通</span></div><h2>'+esc(item.name)+'</h2><p>'+esc(item.description)+'</p><div class="module-visual" role="img" aria-label="'+esc(item.name)+'业务预览"></div><div class="meta">'+esc(roleNames[item.access_role]||item.access_role)+' · '+esc(item.current_release?.version_label||'尚无正式版')+' · '+Number(overview.module_scheme_counts[item.key]||0)+' 个方案</div><a class="btn primary" href="'+esc(item.customer_entry)+'"><span>进入模块</span><span aria-hidden="true">→</span></a></article>';}).join(''):'<div class="empty">本单位暂未开通业务模块，请联系平台管理员。</div>';document.getElementById('loginView').style.display='none';}catch(error){showError(error.message);document.getElementById('loginView').style.display='flex';}}
    document.getElementById('loginPass').addEventListener('keydown',event=>{if(event.key==='Enter')login();});boot();
  </script>
</body>
</html>
