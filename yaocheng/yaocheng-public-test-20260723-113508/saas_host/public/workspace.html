<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>业务资料中心 · 曜程</title>
  <link rel="icon" href="data:,">
  <script src="/customer-entry-guard.js"></script>
  <style>
    :root{--blue:#245de8;--blue2:#163fa7;--green:#16825f;--ink:#17243a;--muted:#66758b;--line:#dbe4ef;--bg:#eef4fc;--panel:#fff;--danger:#b42318;--shadow:0 16px 44px rgba(22,36,58,.09)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink);background:linear-gradient(145deg,#edf4ff,#f4fbf8)}button,input,select,textarea{font:inherit}.shell{max-width:1240px;margin:auto;padding:26px 18px 46px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.mark{width:48px;height:48px;border-radius:14px;background:linear-gradient(145deg,var(--blue),var(--blue2));display:grid;place-items:center;color:#fff;font-size:22px;font-weight:900;box-shadow:0 12px 26px rgba(36,93,232,.24)}h1{font-size:28px;margin:0 0 3px}.sub{font-size:12px;color:var(--muted)}.top-actions,.row-actions,.modal-actions{display:flex;align-items:center;gap:8px}.btn{border:1px solid var(--line);background:#fff;color:#30405a;border-radius:9px;padding:9px 13px;font-weight:750;cursor:pointer;text-decoration:none}.btn:hover{border-color:#aac0dc}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{color:var(--danger);border-color:#fecaca}.btn.small{padding:6px 9px;font-size:12px}.overview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:15px}.metric{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 8px 24px rgba(22,36,58,.05)}.metric span{display:block;color:var(--muted);font-size:12px}.metric b{display:block;font-size:22px;margin-top:6px}.workspace{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.tabs{display:flex;gap:4px;padding:12px 14px 0;border-bottom:1px solid var(--line);overflow-x:auto}.tab{border:0;background:transparent;padding:11px 16px;color:#64748b;font-weight:800;white-space:nowrap;border-radius:9px 9px 0 0;cursor:pointer}.tab.active{background:#edf3ff;color:#2254c8}.pane{display:none;padding:18px}.pane.active{display:block}.pane-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}.pane-head h2{margin:0 0 4px;font-size:18px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.control{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;min-width:210px}.control:focus{outline:3px solid rgba(36,93,232,.14);border-color:#7aa0f6}.table-scroll{width:100%;overflow:auto;border:1px solid var(--line);border-radius:12px}.table{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}.table th,.table td{padding:11px 12px;border-bottom:1px solid #e8edf4;text-align:left;white-space:nowrap;vertical-align:middle}.table th{background:#f7f9fc;color:#5d6b7f;font-size:12px}.table tbody tr:hover{background:#f9fbff}.table tr:last-child td{border-bottom:0}.empty{padding:38px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;background:#fbfcfe}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;background:#edf3ff;color:#2857c5;font-size:11px;font-weight:800}.session-boot{position:fixed;inset:0;z-index:110;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#edf4ff,#f4fbf8);color:var(--muted);font-weight:800}.login{position:fixed;inset:0;z-index:100;background:linear-gradient(145deg,#edf4ff,#f4fbf8);display:none;align-items:center;justify-content:center;padding:18px}.login-card{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:25px;box-shadow:0 24px 70px rgba(15,23,42,.16)}.login-card h1{font-size:25px}.field{margin-top:12px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px}.error{display:none;margin:10px 0;padding:9px 10px;border:1px solid #fecaca;background:#fff1f2;color:var(--danger);border-radius:9px;font-size:12px}.mask{position:fixed;inset:0;z-index:80;background:rgba(15,23,42,.48);display:none;align-items:center;justify-content:center;padding:14px}.modal{width:min(560px,100%);max-height:calc(100vh - 28px);overflow:auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 28px 80px rgba(15,23,42,.24)}.modal h3{margin:0 0 5px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.field.full{grid-column:1/-1}.modal-actions{justify-content:flex-end;margin-top:17px}.confirm-modal{width:min(460px,100%)}.confirm-icon{width:44px;height:44px;border-radius:13px;background:#fff1f2;color:var(--danger);display:grid;place-items:center;font-weight:900;font-size:21px;margin-bottom:12px}.confirm-message{color:#40506a;line-height:1.75;white-space:pre-line}.toast{position:fixed;right:18px;bottom:18px;z-index:120;max-width:min(380px,calc(100vw - 36px));padding:11px 14px;border-radius:10px;background:#0f766e;color:#fff;box-shadow:0 12px 30px rgba(15,23,42,.22);display:none;font-size:13px}.toast.error{background:var(--danger)}
    @media(max-width:760px){.shell{padding:18px 10px 34px}.top{align-items:flex-start;flex-direction:column}.top-actions{width:100%}.top-actions .btn{flex:1;text-align:center}.overview{grid-template-columns:repeat(2,minmax(0,1fr))}.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:10px;border-bottom:1px solid var(--line);overflow:visible}.tab{border-radius:9px;padding:10px 6px}.pane{padding:13px}.pane-head{flex-direction:column}.toolbar{width:100%}.control{min-width:0;flex:1}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.modal{padding:16px}.mark{width:42px;height:42px}h1{font-size:24px}}
  </style>
</head>
<body>
  <div class="session-boot" id="sessionBootView" role="status" aria-live="polite">正在进入业务资料中心</div>
  <div class="login" id="loginView"><div class="login-card"><div class="brand"><span class="mark">Y</span><div><h1>曜程业务资料中心</h1><div class="sub">客户、供方和方案台账按客户单位隔离</div></div></div><div class="error" id="loginError" role="alert"></div><div class="field"><label for="loginUser">账号</label><input id="loginUser" autocomplete="username"></div><div class="field"><label for="loginPass">密码</label><input id="loginPass" type="password" autocomplete="current-password"></div><button class="btn primary" style="width:100%;margin-top:15px" onclick="login()">登录</button><a href="/modules.html" style="display:block;text-align:center;margin-top:12px;color:#64748b">返回模块中心</a></div></div>
  <main class="shell">
    <header class="top"><div class="brand"><span class="mark">Y</span><div><h1>业务资料中心</h1><div class="sub" id="identity">正在读取本单位资料</div></div></div><div class="top-actions"><a class="btn" href="/modules.html">模块中心</a><button class="btn" onclick="logout()">退出</button></div></header>
    <section class="overview" aria-label="共享业务概览"><div class="metric"><span>客户档案</span><b id="metricCustomers">--</b></div><div class="metric"><span>共享供方</span><b id="metricSuppliers">--</b></div><div class="metric"><span>有效方案</span><b id="metricSchemes">--</b></div><div class="metric"><span>可见模块</span><b id="metricModules">--</b></div></section>
    <section class="workspace">
      <nav class="tabs" aria-label="资料分类"><button class="tab active" data-tab="customers" onclick="showTab('customers')">客户档案</button><button class="tab" data-tab="suppliers" onclick="showTab('suppliers')">供方档案</button><button class="tab" data-tab="schemes" onclick="showTab('schemes')">方案台账</button><button class="tab" data-tab="usage" onclick="showTab('usage')">供方使用台账</button></nav>
      <section class="pane active" id="pane-customers"><div class="pane-head"><div><h2>客户档案</h2><div class="sub">三个模块共用一份客户资料，修改后立即同步。</div></div><div class="toolbar"><input class="control" id="customerSearch" placeholder="搜索客户、联系人或电话" oninput="renderCustomers()"><button class="btn primary library-create" onclick="openEntityModal('customer')">新增客户</button></div></div><div id="customerBody"></div></section>
      <section class="pane" id="pane-suppliers"><div class="pane-head"><div><h2>供方档案</h2><div class="sub">同名供方只保留一份档案，历史方案继续保留快照。</div></div><div class="toolbar"><input class="control" id="supplierSearch" placeholder="搜索供方、类型或电话" oninput="renderSuppliers()"><button class="btn primary library-create" onclick="openEntityModal('supplier')">新增供方</button></div></div><div id="supplierBody"></div></section>
      <section class="pane" id="pane-schemes"><div class="pane-head"><div><h2>跨模块方案台账</h2><div class="sub">这里只汇总最新版方案，编辑与输出仍回到对应业务模块。</div></div><div class="toolbar"><select class="control" id="schemeModule" onchange="loadSchemes()"><option value="">全部可见模块</option><option value="day1">单日大研学</option><option value="multiday">多日大研学</option><option value="dispatch">派车宝</option></select><input class="control" id="schemeSearch" placeholder="搜索客户、方案或创建人" oninput="scheduleSchemeSearch()"></div></div><div id="schemeBody"></div></section>
      <section class="pane" id="pane-usage"><div class="pane-head"><div><h2>供方使用台账</h2><div class="sub">汇总当前账号可见模块的最新版方案，金额由服务端重新计算。</div></div><div class="toolbar"><input class="control" id="usageSearch" placeholder="搜索模块、客户、方案或供方" oninput="renderUsage()"><button class="btn" onclick="exportUsage()">导出台账</button></div></div><div id="usageBody"></div></section>
    </section>
  </main>

  <div class="mask" id="entityMask" aria-hidden="true"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="entityTitle"><h3 id="entityTitle">新增档案</h3><div class="sub" id="entityHint"></div><div class="error" id="entityError" role="alert"></div><div class="form-grid"><div class="field full"><label for="entityName">名称</label><input id="entityName" maxlength="100"></div><div class="field supplier-only"><label for="entityType">供方类型</label><select id="entityType"><option>交通费</option><option>餐饮住宿</option><option>场地服务</option><option>物料其他</option><option>其他</option></select></div><div class="field"><label for="entityContact">联系人</label><input id="entityContact" maxlength="50"></div><div class="field"><label for="entityPhone">联系电话</label><input id="entityPhone" maxlength="30"></div><div class="field full"><label for="entityNotes">备注</label><textarea id="entityNotes" rows="3" maxlength="500"></textarea></div></div><div class="modal-actions"><button class="btn" id="entityCancel" onclick="closeEntityModal()">取消</button><button class="btn primary" id="entitySave" onclick="saveEntity()">保存</button></div></div></div>
  <div class="mask" id="confirmMask" aria-hidden="true"><div class="modal confirm-modal" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmMessage"><div class="confirm-icon">!</div><h3 id="confirmTitle">请确认操作</h3><div class="confirm-message" id="confirmMessage"></div><div class="modal-actions"><button class="btn" id="confirmCancel">取消</button><button class="btn danger" id="confirmOk">确认</button></div></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    'use strict';
    localStorage.removeItem('yx_saas_customer_token');let currentUser=null,overview=null,customers=[],suppliers=[],schemes=[],usage=[];let editingType='',editingId=0,entitySaving=false,schemeTimer=0,confirmResolve=null;
    const roleNames={tenant_admin:'客户超级管理员',day1_admin:'单日模块管理员',user:'业务操作员',viewer:'查看人员'};
    function esc(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
    function csrfToken(){const cookie=String(document.cookie||''),match=cookie.match(/(?:^|;\s*)yaocheng_customer_csrf=([^;]+)/)||cookie.match(/(?:^|;\s*)yaocheng_csrf=([^;]+)/);return match?decodeURIComponent(match[1]):'';}
    async function api(path,options={}){const method=(options.method||'GET').toUpperCase(),headers={'Content-Type':'application/json','X-Yaocheng-Session-Scope':'customer'},csrf=csrfToken();if(['POST','PATCH','DELETE'].includes(method)&&csrf)headers['X-CSRF-Token']=csrf;const response=await fetch(path,{method,headers,credentials:'same-origin',body:options.body===undefined?undefined:JSON.stringify(options.body)});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'请求失败');return data;}
    function toast(message,error=false){const box=document.getElementById('toast');clearTimeout(toast.timer);box.textContent=message;box.className='toast'+(error?' error':'');box.setAttribute('role',error?'alert':'status');box.setAttribute('aria-live',error?'assertive':'polite');box.style.display='block';toast.timer=setTimeout(()=>box.style.display='none',3200);}
    function loginError(message){const box=document.getElementById('loginError');box.textContent=message||'';box.style.display=message?'block':'none';}
    async function login(){try{await api('/api/login',{method:'POST',body:{username:document.getElementById('loginUser').value.trim(),password:document.getElementById('loginPass').value}});await boot();}catch(error){loginError(error.message);}}
    async function logout(){try{await api('/api/logout',{method:'POST',body:{}});}catch(error){}location.reload();}
    function showTab(name){document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('active',el.dataset.tab===name));document.querySelectorAll('.pane').forEach(el=>el.classList.toggle('active',el.id==='pane-'+name));if(name==='schemes')loadSchemes();if(name==='usage')loadUsage();}
    function applyPermissions(){const canCreate=overview?.permissions?.can_create_library===true;document.querySelectorAll('.library-create').forEach(el=>el.style.display=canCreate?'inline-flex':'none');}
    function table(headers,rows,minWidth='760px'){return '<div class="table-scroll"><table class="table" style="min-width:'+minWidth+'"><thead><tr>'+headers.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(cell=>'<td>'+cell+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';}
    async function refreshOverview(){overview=await api('/api/workspace/overview');document.getElementById('metricCustomers').textContent=overview.customer_count+' 个';document.getElementById('metricSuppliers').textContent=overview.supplier_count+' 个';document.getElementById('metricSchemes').textContent=overview.scheme_count+' 个';document.getElementById('metricModules').textContent=Object.keys(overview.module_roles||{}).length+' 个';applyPermissions();}
    async function loadCustomers(){customers=(await api('/api/customers')).items||[];renderCustomers();}
    function renderCustomers(){const q=document.getElementById('customerSearch').value.trim().toLowerCase(),items=customers.filter(x=>!q||[x.name,x.contact,x.phone,x.notes].join(' ').toLowerCase().includes(q));const box=document.getElementById('customerBody');if(!items.length){box.innerHTML='<div class="empty">'+(q?'没有匹配的客户档案':'暂无客户档案。可写账号可以从右上角新增。')+'</div>';return;}box.innerHTML=table(['客户名称','联系人','联系电话','备注','操作'],items.map(x=>[esc(x.name),esc(x.contact||'--'),esc(x.phone||'--'),esc(x.notes||'--'),'<div class="row-actions">'+(x.can_edit?'<button class="btn small" onclick="openEntityModal(\'customer\','+x.id+')">编辑</button>':'')+(x.can_delete?'<button class="btn small danger" onclick="deleteEntity(\'customer\','+x.id+')">删除</button>':'')+'</div>']), '820px');}
    async function loadSuppliers(){suppliers=(await api('/api/suppliers')).items||[];renderSuppliers();}
    function renderSuppliers(){const q=document.getElementById('supplierSearch').value.trim().toLowerCase(),items=suppliers.filter(x=>!q||[x.name,x.type,x.contact,x.phone,x.notes].join(' ').toLowerCase().includes(q));const box=document.getElementById('supplierBody');if(!items.length){box.innerHTML='<div class="empty">'+(q?'没有匹配的供方档案':'暂无供方档案。保存方案时也可自动补充供方。')+'</div>';return;}box.innerHTML=table(['供方名称','类型','联系人','联系电话','备注','操作'],items.map(x=>[esc(x.name),'<span class="badge">'+esc(x.type||'其他')+'</span>',esc(x.contact||'--'),esc(x.phone||'--'),esc(x.notes||'--'),'<div class="row-actions">'+(x.can_edit?'<button class="btn small" onclick="openEntityModal(\'supplier\','+x.id+')">编辑</button>':'')+(x.can_delete?'<button class="btn small danger" onclick="deleteEntity(\'supplier\','+x.id+')">删除</button>':'')+'</div>']), '900px');}
    function openEntityModal(type,id=0){editingType=type;editingId=Number(id)||0;const list=type==='customer'?customers:suppliers,item=list.find(x=>Number(x.id)===editingId)||{};document.getElementById('entityTitle').textContent=(editingId?'编辑':'新增')+(type==='customer'?'客户档案':'供方档案');document.getElementById('entityHint').textContent=type==='customer'?'客户资料将在三个业务模块中同步使用。':'同一客户单位内供方名称不能重复。';document.querySelectorAll('.supplier-only').forEach(el=>el.style.display=type==='supplier'?'block':'none');document.getElementById('entityName').value=item.name||'';document.getElementById('entityType').value=item.type||'其他';document.getElementById('entityContact').value=item.contact||'';document.getElementById('entityPhone').value=item.phone||'';document.getElementById('entityNotes').value=item.notes||'';document.getElementById('entityError').style.display='none';document.getElementById('entityMask').style.display='flex';document.getElementById('entityMask').setAttribute('aria-hidden','false');setTimeout(()=>document.getElementById('entityName').focus(),0);}
    function closeEntityModal(force=false){if(entitySaving&&!force)return;document.getElementById('entityMask').style.display='none';document.getElementById('entityMask').setAttribute('aria-hidden','true');editingType='';editingId=0;}
    function setEntitySaving(value){entitySaving=value;document.getElementById('entitySave').disabled=value;document.getElementById('entityCancel').disabled=value;document.getElementById('entityMask').setAttribute('aria-busy',String(value));}
    async function saveEntity(){if(entitySaving)return;const type=editingType,id=editingId,body={name:document.getElementById('entityName').value.trim(),contact:document.getElementById('entityContact').value.trim(),phone:document.getElementById('entityPhone').value.trim(),notes:document.getElementById('entityNotes').value.trim()};if(type==='supplier')body.type=document.getElementById('entityType').value;const errorBox=document.getElementById('entityError');if(!body.name){errorBox.textContent='请输入名称';errorBox.style.display='block';return;}setEntitySaving(true);try{const base=type==='customer'?'/api/customers':'/api/suppliers';await api(id?base+'/'+id:base,{method:id?'PATCH':'POST',body});const label=type==='customer'?'客户':'供方';closeEntityModal(true);toast(label+(id?'资料已更新':'已新增'));await Promise.all([refreshOverview(),type==='customer'?loadCustomers():loadSuppliers()]);}catch(error){errorBox.textContent=error.message;errorBox.style.display='block';}finally{setEntitySaving(false);}}
    function askConfirm(message,title='请确认操作'){document.getElementById('confirmTitle').textContent=title;document.getElementById('confirmMessage').textContent=message;const mask=document.getElementById('confirmMask');mask.style.display='flex';mask.setAttribute('aria-hidden','false');setTimeout(()=>document.getElementById('confirmCancel').focus(),0);return new Promise(resolve=>{confirmResolve=resolve;});}
    function finishConfirm(value){document.getElementById('confirmMask').style.display='none';document.getElementById('confirmMask').setAttribute('aria-hidden','true');const resolve=confirmResolve;confirmResolve=null;if(resolve)resolve(value);}
    document.getElementById('confirmCancel').onclick=()=>finishConfirm(false);document.getElementById('confirmOk').onclick=()=>finishConfirm(true);
    async function deleteEntity(type,id){const list=type==='customer'?customers:suppliers,item=list.find(x=>Number(x.id)===Number(id));if(!item||!item.can_delete)return;const label=type==='customer'?'客户':'供方';if(!await askConfirm('确定删除'+label+'“'+item.name+'”？\n历史方案会保留名称快照，不会删除历史业务记录。','删除'+label+'档案'))return;try{await api((type==='customer'?'/api/customers/':'/api/suppliers/')+id,{method:'DELETE'});toast(label+'档案已删除');await Promise.all([refreshOverview(),type==='customer'?loadCustomers():loadSuppliers(),loadSchemes(false)]);if(type==='supplier')await loadUsage(false);}catch(error){toast(error.message,true);}}
    function scheduleSchemeSearch(){clearTimeout(schemeTimer);schemeTimer=setTimeout(()=>loadSchemes(),180);}
    async function loadSchemes(showLoading=true){const box=document.getElementById('schemeBody');if(showLoading)box.innerHTML='<div class="empty">正在读取方案台账…</div>';const params=new URLSearchParams(),q=document.getElementById('schemeSearch').value.trim(),key=document.getElementById('schemeModule').value;if(q)params.set('q',q);if(key)params.set('module_key',key);try{schemes=(await api('/api/workspace/schemes?'+params)).items||[];box.innerHTML=schemes.length?table(['业务模块','日期','客户','方案名称','版本','创建人','入口'],schemes.map(x=>['<span class="badge">'+esc(x.module_name)+'</span>',esc(x.project_date||'--'),esc(x.customer_name||'未关联客户'),esc(x.scheme_name),'第'+Number(x.version||1)+'版',esc(x.created_by_name||'--'),'<a class="btn small" href="'+esc(x.module_entry)+'">进入模块</a>']),'900px'):'<div class="empty">暂无匹配的最新版方案。</div>';}catch(error){box.innerHTML='<div class="empty">'+esc(error.message)+'</div>';}}
    async function loadUsage(showLoading=true){const box=document.getElementById('usageBody');if(showLoading)box.innerHTML='<div class="empty">正在读取供方台账…</div>';try{usage=(await api('/api/supplier-stats')).details||[];renderUsage();}catch(error){box.innerHTML='<div class="empty">'+esc(error.message)+'</div>';}}
    function renderUsage(){const q=document.getElementById('usageSearch').value.trim().toLowerCase(),items=usage.filter(x=>!q||[x.module_name,x.customer_name,x.scheme_name,x.cost_item,x.supplier_name].join(' ').toLowerCase().includes(q));const box=document.getElementById('usageBody');box.innerHTML=items.length?table(['模块','日期','客户','方案','费用项','供方','数量','金额'],items.map(x=>['<span class="badge">'+esc(x.module_name)+'</span>',esc(x.date),esc(x.customer_name),esc(x.scheme_name),esc(x.cost_item),esc(x.supplier_name),Number(x.quantity||0).toLocaleString('zh-CN')+' '+esc(x.unit||''),'¥'+Number(x.amount||0).toLocaleString('zh-CN',{maximumFractionDigits:2})]),'1050px'):'<div class="empty">'+(q?'没有匹配的供方使用记录。':'暂无供方使用记录。保存带供方的方案后会自动汇总。')+'</div>';}
    async function exportUsage(){try{const response=await fetch('/api/supplier-stats.xlsx',{credentials:'same-origin'});if(!response.ok){const data=await response.json().catch(()=>({}));throw new Error(data.error||'导出失败');}const blob=await response.blob(),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='曜程供方使用台账.xlsx';document.body.appendChild(link);link.click();link.remove();URL.revokeObjectURL(url);toast('供方使用台账已导出');}catch(error){toast(error.message,true);}}
    async function boot(){if(!csrfToken()){if(typeof YaochengCustomerEntry!=='undefined')YaochengCustomerEntry.redirect();return;}try{const me=await api('/api/me');currentUser=me.user;document.getElementById('identity').textContent=currentUser.username+' · '+(roleNames[currentUser.role]||currentUser.role)+' · 数据范围：本单位';await Promise.all([refreshOverview(),loadCustomers(),loadSuppliers(),loadSchemes(),loadUsage()]);document.getElementById('loginView').style.display='none';document.getElementById('sessionBootView').style.display='none';}catch(error){if(typeof YaochengCustomerEntry!=='undefined')YaochengCustomerEntry.redirect();}}
    document.addEventListener('keydown',event=>{if(event.key!=='Escape')return;if(document.getElementById('confirmMask').style.display==='flex')finishConfirm(false);else if(document.getElementById('entityMask').style.display==='flex')closeEntityModal();});document.getElementById('loginPass').addEventListener('keydown',event=>{if(event.key==='Enter')login();});boot();
  </script>
</body>
