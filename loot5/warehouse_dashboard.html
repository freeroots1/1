<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仓库货物动态看板</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        
        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }
        
        .header h1 {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 14px;
        }
        
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            transition: transform 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-card .icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        
        .stat-card .number {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
            margin: 10px 0;
        }
        
        .stat-card .label {
            color: #666;
            font-size: 14px;
        }
        
        .charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .chart-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .chart-card h3 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 18px;
        }
        
        .table-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow-x: auto;
        }
        
        .table-container h3 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 18px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            background: #667eea;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }
        
        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        
        tr:hover {
            background: #f5f5f5;
        }
        
        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
            transition: all 0.3s;
        }
        
        .refresh-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.6);
        }
        
        .timestamp {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 20px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>📦 仓库货物动态看板</h1>
            <p>数据更新时间: <span id="updateTime"></span></p>
        </div>
        
        <div class="stats-container">
            <div class="stat-card">
                <div class="icon">📊</div>
                <div class="number" id="totalDevices">0</div>
                <div class="label">设备种类</div>
            </div>
            
            <div class="stat-card">
                <div class="icon">📦</div>
                <div class="number" id="totalQuantity">0</div>
                <div class="label">总库存量（件）</div>
            </div>
            
            <div class="stat-card">
                <div class="icon">🏷️</div>
                <div class="number" id="totalBrands">0</div>
                <div class="label">品牌数量</div>
            </div>
            
            <div class="stat-card">
                <div class="icon">⚠️</div>
                <div class="number" id="lowStock">0</div>
                <div class="label">库存 < 10 件</div>
            </div>
        </div>
        
        <div class="charts-container">
            <div class="chart-card">
                <h3>📊 品牌库存分布</h3>
                <canvas id="brandChart"></canvas>
            </div>
            
            <div class="chart-card">
                <h3>📈 库存 Top 10</h3>
                <canvas id="top10Chart"></canvas>
            </div>
        </div>
        
        <div class="table-container">
            <h3>📋 库存明细表（按数量排序）</h3>
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>序号</th>
                        <th>设备名称</th>
                        <th>品牌</th>
                        <th>型号/规格</th>
                        <th>数量</th>
                        <th>状态</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
        
        <div class="timestamp">
            仓库管理系统 © 2026 | 本看板数据来源于汇总表
        </div>
    </div>
    
    <button class="refresh-btn" onclick="loadData()">🔄 刷新数据</button>
    
    <script>
        let brandChartInstance = null;
        let top10ChartInstance = null;
        
        function loadData() {
            // 这里应该从 CSV 文件加载数据
            // 为了演示，我们使用内嵌数据
            
            // 更新时间
            document.getElementById('updateTime').textContent = new Date().toLocaleString('zh-CN');
            
            // 加载 CSV 数据（实际部署时需要服务器支持）
            fetch('仓库货物汇总表_20260525.csv')
                .then(response => response.text())
                .then(csvText => {
                    const data = parseCSV(csvText);
                    updateStats(data);
                    updateCharts(data);
                    updateTable(data);
                })
                .catch(error => {
                    console.error('加载 CSV 失败:', error);
                    // 使用默认数据
                    useDefaultData();
                });
        }
        
        function parseCSV(csvText) {
            const lines = csvText.split('\n');
            const headers = lines[0].split(',').map(h => h.trim());
            const data = [];
            
            for (let i = 1; i < lines.length; i++) {
                if (lines[i].trim()) {
                    const values = lines[i].split(',');
                    const item = {};
                    headers.forEach((header, index) => {
                        item[header] = values[index] ? values[index].trim() : '';
                    });
                    data.push(item);
                }
            }
            
            return data.sort((a, b) => parseInt(b.数量) - parseInt(a.数量));
        }
        
        function updateStats(data) {
            const totalDevices = data.length;
            const totalQuantity = data.reduce((sum, item) => sum + parseInt(item.数量 || 0), 0);
            const brands = new Set(data.map(item => item.品牌));
            const lowStock = data.filter(item => parseInt(item.数量) < 10).length;
            
            animateNumber('totalDevices', totalDevices);
            animateNumber('totalQuantity', totalQuantity);
            animateNumber('totalBrands', brands.size);
            animateNumber('lowStock', lowStock);
        }
        
        function animateNumber(elementId, target) {
            const el = document.getElementById(elementId);
            const duration = 1000;
            const step = target / (duration / 16);
            let current = 0;
            
            const timer = setInterval(() => {
                current += step;
                if (current >= target) {
                    current = target;
                    clearInterval(timer);
                }
                el.textContent = Math.floor(current);
            }, 16);
        }
        
        function updateCharts(data) {
            // 品牌分布图
            const brandData = {};
            data.forEach(item => {
                const brand = item.品牌;
                brandData[brand] = (brandData[brand] || 0) + parseInt(item.数量 || 0);
            });
            
            const topBrands = Object.entries(brandData)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 10);
            
            if (brandChartInstance) brandChartInstance.destroy();
            const brandCtx = document.getElementById('brandChart').getContext('2d');
            brandChartInstance = new Chart(brandCtx, {
                type: 'doughnut',
                data: {
                    labels: topBrands.map(b => b[0]),
                    datasets: [{
                        data: topBrands.map(b => b[1]),
                        backgroundColor: [
                            '#667eea', '#764ba2', '#f093fb', '#f5576c',
                            '#4facfe', '#00f2fe', '#43e97b', '#38f9d7',
                            '#ffd89b', '#19547b'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'right' }
                    }
                }
            });
            
            // Top 10 柱状图
            const top10 = data.slice(0, 10);
            
            if (top10ChartInstance) top10ChartInstance.destroy();
            const top10Ctx = document.getElementById('top10Chart').getContext('2d');
            top10ChartInstance = new Chart(top10Ctx, {
                type: 'bar',
                data: {
                    labels: top10.map(item => item.设备名称.length > 10 ? item.设备名称.substring(0, 10) + '...' : item.设备名称),
                    datasets: [{
                        label: '库存数量',
                        data: top10.map(item => parseInt(item.数量)),
                        backgroundColor: 'rgba(102, 126, 234, 0.8)',
                        borderColor: 'rgba(102, 126, 234, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }
        
        function updateTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            data.forEach((item, index) => {
                const row = tbody.insertRow();
                row.insertCell(0).textContent = index + 1;
                row.insertCell(1).textContent = item.设备名称;
                row.insertCell(2).textContent = item.品牌;
                row.insertCell(3).textContent = item['型号/规格'];
                row.insertCell(4).textContent = item.数量;
                
                const statusCell = row.insertCell(5);
                const qty = parseInt(item.数量);
                if (qty >= 100) {
                    statusCell.innerHTML = '<span style="color: green;">充足</span>';
                } else if (qty >= 10) {
                    statusCell.innerHTML = '<span style="color: orange;">正常</span>';
                } else {
                    statusCell.innerHTML = '<span style="color: red;">偏低</span>';
                }
            });
        }
        
        function useDefaultData() {
            // 如果 CSV 加载失败，使用内嵌数据
            alert('无法加载 CSV 文件，请确保文件在同一目录下。');
        }
        
        // 页面加载时初始化
        window.onload = function() {
            loadData();
            // 每30秒自动刷新
            setInterval(loadData, 30000);
        };
    </script>
</body>
</html>
